name: 构建 APK

# 触发方式（任选其一）：
#   1. 推送 v* 标签：  git tag v1.0 && git push origin v1.0
#   2. 手动触发：     GitHub 仓库 → Actions → 构建 APK → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev \
            libsqlite3-dev libbz2-dev liblzma-dev

      - name: 安装 Buildozer / Cython
        run: |
          python -m pip install --upgrade pip
          # Cython 必须 < 3.0：p4a 的构建脚本与 Cython 3 不兼容
          pip install "cython<3.0" buildozer

      - name: 构建 APK（首次约 25-40 分钟，含下载 Android SDK/NDK）
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log || true
          echo "---- 构建结果 ----"
          ls -lh bin/ 2>/dev/null || echo "bin 目录不存在"

      - name: 上传 APK 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 诡牌筑局-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 上传构建日志（便于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
