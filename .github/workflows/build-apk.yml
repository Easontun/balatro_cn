name: 构建 APK

# 触发方式：
#   1. 推送到 master 分支（最常用，推送即自动构建）
#   2. 推送 v* 标签：  git tag v1.0 && git push origin v1.0
#   3. 手动触发：     GitHub 仓库 → Actions → 构建 APK → Run workflow
# 注意：若只配 tags 触发，推送 master 不会自动构建，容易造成"改了没生效"的误解。
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    # 必须用 22.04：ubuntu-latest 现在是 24.04(noble)，
    # 而 libtinfo5 在 24.04 已被移除，且 p4a 主要在 22.04 上验证。
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev cmake libffi-dev libssl-dev libltdl-dev \
            libsqlite3-dev libbz2-dev liblzma-dev
          # ncurses 相关包在部分 Ubuntu 版本里缺失（如 24.04 无 libtinfo5），
          # 非构建必需，单独安装并容错，避免整个 job 失败
          sudo apt-get install -y --no-install-recommends \
            libncurses5-dev libncursesw5-dev libtinfo5 || \
            echo "（部分 ncurses 包不可用，已跳过，不影响构建）"

      - name: 安装 Buildozer / Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Cython 必须 < 3.0：p4a 的构建脚本与 Cython 3 不兼容
          # virtualenv 一并装上：buildozer 建隔离环境时会优先用它
          pip install "cython<3.0" buildozer virtualenv
          buildozer --version

      - name: 构建 APK（首次约 25-40 分钟，含下载 Android SDK/NDK）
        run: |
          # 不要用 `yes | buildozer`：GitHub Actions 默认开启 pipefail，
          # yes 被 SIGPIPE 杀掉(退出码 141)会让构建"假失败"。
          # SDK 授权已由 buildozer.spec 的 android.accept_sdk_license = True 处理。
          buildozer -v android debug 2>&1 | tee build.log
          echo "---- 查找所有 .apk ----"
          find . -name "*.apk" -type f -ls || true
          echo "---- bin/ 目录内容 ----"
          ls -lha bin/ 2>/dev/null || echo "bin 目录不存在"
          echo "---- 校验 APK 必须存在 ----"
          apk_count=$(find bin -name "*.apk" -type f | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: 未找到 bin/*.apk"
            exit 1
          fi
          echo "找到 $apk_count 个 APK"

      - name: 上传 APK 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 诡牌筑局-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 上传构建日志（无论成败都上传，便于排查无 APK 的"假成功"）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
